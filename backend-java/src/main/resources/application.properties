# Server port — defaults to 5000, same as the Node.js backend, so the frontend needs no changes
server.port=${PORT:5000}

# MongoDB connection URI (required) — equivalent to MONGO_URI in Node.js .env
spring.data.mongodb.uri=${MONGO_URI}

# ── Gemini API ──────────────────────────────────────────────────────────────
# Gemini API key — equivalent to GEMINI_KEY in Node.js .env
gemini.key=${GEMINI_KEY}
# Embedding model (default matches Node.js default)
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:models/gemini-embedding-001}
# Answer/generation model (default matches Node.js default)
gemini.answer.model=${GEMINI_ANSWER_MODEL:gemini-2.5-flash}
# Comma-separated list of fallback answer models
gemini.answer.fallback.models=${GEMINI_ANSWER_FALLBACK_MODELS:}

# ── Firecrawl API ────────────────────────────────────────────────────────────
# Firecrawl API key — equivalent to FIRECRAWL_KEY in Node.js .env
firecrawl.key=${FIRECRAWL_KEY}

# ── Async thread pool (used for background website mapping) ──────────────────
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
